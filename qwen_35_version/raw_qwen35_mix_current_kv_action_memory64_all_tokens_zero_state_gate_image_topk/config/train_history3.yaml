datasets:
  vla_data:
    action_mode: abs
    balance_task_step_counts: true
    data_mix: rmbench9
    data_root_dir: /mnt/dolphinfs/ssd_pool/docker/user/hadoop-mlm-hlsc/hadoop-mlm/zhoujiacong/code/RMBench/data/lerobot_2.1
    dataset_py: lerobot_datasets
    image_size:
    - 224
    - 224
    keyframe_image_memory:
      enabled: false
      max_keyframes: 4
    num_workers: 8
    num_camera_views: 3
    per_device_batch_size: 2
    preserve_episode_batch_slots: true
    refill_slots_per_step: true
    provide_teacher_commit_images: false
    sampling_interval: 50
    sequential_step_sampling: true
    pack_tbptt_windows: true
    batch_tbptt_video: true
    episode_phase_mode: balanced_random
    include_state: false
    progress_aux_weight: 0.0
    shuffle_trajectories: true
    temporal:
      enabled: true
      image:
        absolute_indices: []
        include_initial: false
        include_current: true
        delta_indices:
        - -30
        - -15
        - 0
    use_sequential_episode_sampler: true
    video_backend: pyav
    prefetch_factor: 2
    processor_in_dataloader_workers: true
    pin_memory: true
    persistent_workers: true
    load_all_data_for_training: true
debug_mode: false
framework:
  action_token: "\u25c6"
  action_model:
    action_dim: 14
    action_hidden_dim: 2560
    action_horizon: 50
    action_model_type: MLP
    future_action_window_size: 49
    past_action_window_size: 0
  memory_ablation_mode: raw_anchors_only
  memory_buffer:
    disable_current_frame_keyframe_write_in_eval: true
    enable: false
    enable_delayed_chunk_event_commit: true
    enable_keyframe_inference_event_filter: true
    event_commit_threshold: 0.55
    event_future_min_offset: 1
    force_memory_write_current_for_event_commit: false
    keyframe_cooldown_steps: 20
    keyframe_eval_memory_source: predict
    keyframe_loss_weight: 0.0
    keyframe_nms_window: 20
    keyframe_positive_weight: 7.0
    keyframe_predict_mode: chunk_future
    keyframe_schedule_mix_granularity: sample
    keyframe_schedule_teacher_prob_end: 0.0
    keyframe_schedule_teacher_prob_start: 1.0
    keyframe_schedule_transition_steps: 30000
    keyframe_schedule_warmup_steps: 10000
    keyframe_threshold: 0.5
    keyframe_train_memory_schedule: teacher_to_predict
    keyframe_train_memory_source: teacher_to_predict
    memory_write_policy: disabled
    qwen_memory_injection:
      enabled: true
      keyframe_image_position: after_anchor_images_before_action
      max_keyframe_images: 0
      mode: raw_anchors_only
      use_image_role_text: true
    use_keyframe_predict_head: disabled
    use_teacher_future_frame_write_in_train: false
  name: RawQwen35MixCurrentKVActionMemory64AllTokensZeroStateGateImageTopK
  recurrent_state_mode: memory_queries
  memory_queries:
    count: 64
    native_s_policy: reset_every_decision
    initial_state: zeros
    mask_empty_read: true
    update_rule: gated
    gate_granularity: slot
    gate_initial_write_ratio: 0.2
    force_first_write: true
    initializer_range: 0.02
    feedback_projection_init_scale: 0.02
  moba_memory:
    enabled: true
    history_query_scope: all_tokens
    cache_grad: detached
    # Input deltas to write: [0] current only; null all; [] no visual KV writes.
    cache_delta_indices: [0]
    topk_history_images: 4
    max_history_frames: null
    block_unit: image
    attention_backend: flex
  qwenvl:
    attn_implementation: flash_attention_2
    base_vlm: /mnt/dolphinfs/ssd_pool/docker/user/hadoop-mlm-hlsc/hadoop-mlm/zhoujiacong/models/Qwen3.5-4B
run_id: rmbench9_raw_qwen35_mix_current_kv_action_memory64_all_tokens_zero_state_gate_image_topk_history3_s_only_moba_top4_zero1_b2
run_root_dir: /mnt/dolphinfs/ssd_pool/docker/user/hadoop-mlm-hlsc/hadoop-mlm/zhoujiacong/code/RMBench/EventVLA/EventVLA/results/qwen35-runs
seed: 42
trainer:
  eval_interval: 1000
  tbptt_steps: 2
  batch_window_vision: true
  release_unused_cuda_cache_before_backward: false
  freeze_modules: ''
  gradient_accumulation_steps: 1
  gradient_clipping: 1.0
  is_resume: false
  keep_recent_checkpoints: 4
  learning_rate:
    action_model: 0.0001
    base: 1.0e-05
    keyframe_head: 0.0001
    qwen_vl_interface: 1.0e-05
    query_memory: 1.0e-05
  log_keyframe_samples: false
  log_keyframe_samples_all_ranks: false
  log_keyframe_samples_interval: 1
  logging_frequency: 20
  lr_scheduler_type: cosine_with_min_lr
  max_train_steps: 80000
  num_warmup_steps: 5000
  optimizer:
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-08
  save_interval: 10000
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  enable_gradient_checkpointing: false
  save_checkpoints: true
wandb_entity: null
wandb_project: null
